<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Papelería Escolar - Copias</title>
    <style>
        body { font-family: Arial; background: #e75858; text-align: center; padding: 20px; }
        .caja { background: white; width: 350px; margin: auto; padding: 20px; border-radius: 15px; box-shadow: 0 0 10px gray; }
        input, select, button { width: 90%; padding: 10px; margin: 8px 0; font-size: 16px; border-radius: 8px; }
        button { background: #2e86de; color: white; border: none; cursor: pointer; }
        button:hover { background: #1e6cb8; }
        #resultado { background: #dff9fb; padding: 15px; border-radius: 10px; margin-top: 10px; text-align: left; }
    </style>
</head>
<body>

    <div class="caja">
        <h2>Papelería Escolar</h2>
        <h3>Calculadora de Copias</h3>

        <label>Número de copias:</label>
        <input type="number" id="numCopias" placeholder="Ej. 60" min="1">

        <label>Tipo de copia:</label>
        <select id="tipo">
            <option value="color">A Color</option>
            <option value="byn">Blanco y Negro</option>
        </select>

        <label>
            <input type="checkbox" id="credencial" style="width: auto;"> Soy alumno y presento credencial (25% descuento)
        </label>

        <button onclick="calcular()">Calcular Cobro</button>

        <div id="resultado"></div>
    </div>

    <script>
        function calcular() {
            let copias = parseInt(document.getElementById("numCopias").value);
            let tipo = document.getElementById("tipo").value;
            let tieneCredencial = document.getElementById("credencial").checked;

            if (isNaN(copias) || copias <= 0) {
                alert("Por favor escribe el número de copias");
                return;
            }

            let precioPorCopia = 0;

            // Precios según el número de copias
            if (copias >= 1 && copias <= 50) {
                if (tipo == "color") precioPorCopia = 1.50;
                else precioPorCopia = 1.00;
            } else if (copias >= 51 && copias <= 100) {
                if (tipo == "color") precioPorCopia = 1.30;
                else precioPorCopia = 0.80;
            } else if (copias > 100) {
                if (tipo == "color") precioPorCopia = 1.00;
                else precioPorCopia = 0.50;
            }

            let subtotal = copias * precioPorCopia;
            let descuento = 0;

            // Descuento del 25% si presenta credencial
            if (tieneCredencial) {
                descuento = subtotal * 0.25;
            }

            let total = subtotal - descuento;

            document.getElementById("resultado").innerHTML =
                "<b>Copias:</b> " + copias + "<br>" +
                "<b>Tipo:</b> " + (tipo == "color" ? "A Color" : "Blanco y Negro") + "<br>" +
                "<b>Precio por copia:</b> $" + precioPorCopia.toFixed(2) + "<br>" +
                "<b>Subtotal:</b> $" + subtotal.toFixed(2) + "<br>" +
                "<b>Descuento (25%):</b> $" + descuento.toFixed(2) + "<br>" +
                "<b><h3>Total a pagar: $" + total.toFixed(2) + "</h3></b>";
        }
    </script>

</body>
</html>
